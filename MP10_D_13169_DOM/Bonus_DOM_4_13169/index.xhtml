<body onload="init()">
    <h3>Kalkulator &amp; Bentuk Bangun Datar (DOM)</h3>

        <select name="" onchange="ubahLabelBangun()" id="jenisBangun">
            <option value="persegi">Persegi</option>
            <option value="lingkaran">lingkaran</option>
        </select>
    </p>
    <p><span id="labelUkuran">Panjang Sisi (cm)</span>: <input name="" id="nilaiUkuran" value="7" /></p>
    <p><input type="button" onclick="hitungBangun()" value="Hitung Bangun" /></p>
    <p>Luas: <span id="bonusLuas">0</span> cm&sup2;</p>
    <p>Keliling: <span id="bonusKeliling">0</span> cm</p>
    <div id="bentukVisual" style="width: 100px; height: 100px; 
    background-color: coral; border: 2px solid black;">
    </div>
